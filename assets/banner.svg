<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16243b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0b1320" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
      .radar-line { stroke: #00f2fe; stroke-opacity: 0.25; stroke-dasharray: 4,4; }
      .pulse-circle { animation: pulse 3s infinite ease-out; transform-origin: center; }
      .scan-beam { animation: scan 8s linear infinite; transform-origin: 1020px 210px; }
      .float-pill { animation: floatSlow 5s ease-in-out infinite alternate; }
      .float-pill2 { animation: floatSlow 6s ease-in-out infinite alternate-reverse; }

      @keyframes pulse {
        0% { r: 20px; opacity: 0.8; }
        50% { r: 90px; opacity: 0.2; }
        100% { r: 160px; opacity: 0; }
      }
      @keyframes scan {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Matrix Grid -->
  <g class="bg-grid">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420" />
  </g>

  <!-- Dynamic Radar Sensor Rings in the Background -->
  <g id="radar-system">
    <circle cx="1020" cy="210" r="150" fill="none" stroke="#00f2fe" stroke-opacity="0.12" stroke-width="1.5" />
    <circle cx="1020" cy="210" r="105" fill="none" stroke="#00f2fe" stroke-opacity="0.18" stroke-width="1.5" />
    <circle cx="1020" cy="210" r="60" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1.5" />
    
    <!-- Radar Scanning Sweep -->
    <g class="scan-beam">
      <path d="M 1020 210 L 1170 210 A 150 150 0 0 0 1020 60 Z" fill="url(#radarSweep)" />
      <line x1="1020" y1="210" x2="1170" y2="210" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- Radar Target Nodes -->
    <circle cx="980" cy="170" r="4" fill="#00f2fe">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1070" cy="260" r="4" fill="#7000ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1090" cy="140" r="3.5" fill="#38ef7d">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="250" r="3" fill="#ff007f">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subtle Ambient Glow Behind Text Header -->
  <circle cx="280" cy="180" r="180" fill="#00f2fe" opacity="0.06" filter="url(#glow)" />
  <circle cx="480" cy="220" r="150" fill="#7000ff" opacity="0.07" filter="url(#glow)" />

  <!-- Foreground Title and Branding Content -->
  <g transform="translate(80, 0)">
    <!-- Security Badge Pill -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38ef7d">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
        SHIELD • TELEMETRY • EDR • XDR • SENSOR
      </text>
    </g>

    <!-- Main Title (Strictly Foreground with Vibrant Gradient) -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-1">
      Awesome Endpoint Security
    </text>
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      Sensor &amp; Agent Ecosystem
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated telemetry shippers, kernel-level sensors, DFIR engines &amp; open-source EDR agents
    </text>

    <!-- Dynamic Architectural Feature Pills (Foreground Layer) -->
    <g transform="translate(0, 285)">
      <!-- Pill 1: Kernel Visibility -->
      <g class="float-pill">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          ⚡ Kernel &amp; eBPF
        </text>
      </g>

      <!-- Pill 2: Threat Detection -->
      <g transform="translate(195, 0)" class="float-pill2">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#7000ff" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          🛡️ Real-Time EDR
        </text>
      </g>

      <!-- Pill 3: DFIR Interrogation -->
      <g transform="translate(390, 0)" class="float-pill">
        <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#38ef7d" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          🔍 Live DFIR &amp; VQL
        </text>
      </g>

      <!-- Pill 4: Telemetry Pipeline -->
      <g transform="translate(600, 0)" class="float-pill2">
        <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          📊 OpenTelemetry Shippers
        </text>
      </g>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(0, 360)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        Updated November 2026 • Curated Enterprise SaaS &amp; High-Star Open Source Implementations
      </text>
    </g>
  </g>
</svg>
